id = "konkretisasi"
istilah = "konkretisasi"
asal = { istilah = "concrétisation", bahasa = "fr" }
definisi = "Dalam Simondon, proses ketika sebuah benda teknis berkembang dari bagian-bagian yang terpisah dan saling mengganggu menjadi satu kesatuan yang saling menopang. Benda teknis memiliki cara berada yang bisa dipelajari terpisah dari penggunanya."
alasan = "Serapan \"konkretisasi\" dipertahankan karena Indonesia tidak punya kata lain yang membawa arti menjadi padat dan saling bertaut."
yang_hilang = "Dalam Indonesia \"konkret\" berlawanan dengan abstrak; Simondon memakainya dalam arti teknis yang lain (menyatunya fungsi-fungsi), dan pembaca Indonesia cenderung menafsirkannya sebagai \"menjadi nyata\"."
ditolak = [
  { padanan = "pemadatan", alasan = "Tidak ada dasar pemakaian dan menyesatkan ke arah fisik." },
]
terkait = ["artefak", "teknik"]

