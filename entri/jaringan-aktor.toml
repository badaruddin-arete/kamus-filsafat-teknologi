asal = { istilah = "actor-network", bahasa = "en" }
definisi = "Dalam Latour, cara memandang masyarakat sebagai jaringan hubungan antara manusia dan bukan manusia yang sama-sama bertindak (aktan). Benda bukan latar bagi tindakan manusia; ia ikut menjadi pelaku."
alasan = "\"Jaringan\" adalah serapan yang lazim, dan \"aktor\" dipertahankan karena Latour sengaja memakai kata yang biasa dikaitkan dengan manusia dan memperluasnya."
yang_hilang = "Dalam Indonesia \"aktor\" hampir selalu berarti pemeran film atau orang yang bertindak. Latour justru ingin memasukkan benda, tetapi di sini kata itu menolak perluasan. Karena itu, penulis sering memakai \"aktan\" untuk yang bukan manusia."
ditolak = [
