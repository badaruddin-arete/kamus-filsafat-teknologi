id = "teknologi"
istilah = "teknologi"
asal = { istilah = "technology", bahasa = "en" }
definisi = "Dalam pemakaian filsafat teknologi, kata ini sering dipakai longgar untuk benda teknis, cara kerjanya, dan pengetahuan di baliknya sekaligus. Winner menyoroti betapa kabur kata ini dan memakainya dalam arti yang luas."
alasan = "Dipertahankan sebagai kata serapan yang sudah mapan. Entri ini terutama berfungsi mengingatkan bahwa \"teknologi\" dan \"teknik\" dipisah dalam sebagian tradisi, tetapi disamakan di Indonesia dan dalam bahasa Inggris."
yang_hilang = "KBBI VI Daring (diperiksa 2026-11-11) mencatat \"teknologi\" dalam dua makna: metode ilmiah untuk mencapai tujuan praktis atau ilmu pengetahuan terapan, dan keseluruhan sarana untuk menyediakan barang-barang yang diperlukan bagi kelangsungan dan kenyamanan hidup manusia. Jadi KBBI memisahkan \"teknologi\" dari \"teknik\", tetapi pembagiannya tidak sama dengan pembagian Technik dan Technologie dalam bahasa Jerman, sehingga sebagian perdebatan Eropa sulit dialihkan tanpa catatan."
ditolak = [
  { padanan = "ilmu teknik", alasan = "Membatasi pada pengetahuan keinsinyuran dan menyingkirkan benda serta praktiknya." },
]
terkait = ["teknik", "artefak", "teknologi-otonom"]

