id = "keramahan-linguistik"
istilah = "keramahan linguistik"
asal = { istilah = "hospitalité langagière", bahasa = "fr" }
definisi = "Dalam Ricoeur, sikap penerjemah yang menerima bahasa asing sebagai tamu: mengakui bahwa penerjemahan tidak pernah sempurna dan ada yang hilang, tanpa menyerah pada kesenjangan itu. Gagasan ini menjadi pegangan filsafat kamus ini."
alasan = "\"Keramahan\" menjaga gambaran tamu dan tuan rumah. \"Linguistik\" dipertahankan agar jelas yang dimaksud adalah bahasa."
yang_hilang = "Prancis \"hospitalité\" menunjuk ke etika menerima tamu asing, dan dalam Ricoeur dialihkan ke bahasa. \"Keramahan\" Indonesia menjaga gambaran itu, tetapi pemakaian untuk bahasa tergolong baru dan belum lazim."
ditolak = [
  { padanan = "keramahtamahan berbahasa", alasan = "Lebih panjang dan terdengar seperti sopan santun berbicara." },
]
terkait = ["pembingkaian", "perantaraan"]

