id = "perantaraan"
istilah = "perantaraan"
asal = { istilah = "mediation", bahasa = "en" }
definisi = "Dalam Ihde dan Verbeek, hal bahwa teknologi tidak hanya dipakai manusia tetapi ikut membentuk cara manusia mengalami dunia dan bertindak di dalamnya. Kacamata dan termometer tidak netral; mereka menengahi hubungan manusia dengan dunia."
alasan = "Dipilih karena menonjolkan hal yang berada di tengah dan menyampaikan. Gaung penyelesaian sengketa lebih ringan daripada pada \"mediasi\", tetapi tidak hilang sama sekali."
yang_hilang = "KBBI VI Daring (diperiksa 2026-11-11) mencatat \"perantara\" (di bawah lema antara) sebagai orang yang menjadi penengah dalam perselisihan atau penghubung dalam perundingan, dan sebagai pialang, makelar, atau calo. Jadi \"perantara\" pun membawa gaung sengketa dan jual beli. Yang hilang juga gagasan Verbeek bahwa perantara ikut membentuk, bukan sekadar menyampaikan. Bentuk \"perantaraan\" sendiri tidak terlihat di halaman yang diperiksa."
ditolak = [
  { padanan = "mediasi", alasan = "Dalam pemakaian hukum Indonesia sudah berarti penyelesaian sengketa; membawa konotasi yang tidak dimaksud." },
  { padanan = "penengahan", alasan = "Sama dengan mediasi: condong ke melerai." },
]
terkait = ["siap-tangan", "dunia-kehidupan", "jaringan-aktor"]

[[rujukan]]
sumber = "ihde-1990"
status = "belum"

[[rujukan]]
sumber = "verbeek-2005"
status = "belum"

