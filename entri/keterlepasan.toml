id = "keterlepasan"
istilah = "keterlepasan"
asal = { istilah = "Gelassenheit", bahasa = "de" }
definisi = "Dalam Heidegger kemudian, sikap yang memungkinkan manusia memakai perangkat teknis tanpa dikuasai olehnya: berkata ya dan sekaligus tidak kepada dunia teknis. Heidegger memakainya sebagai jalan keluar dari cara pandang pembingkaian."
alasan = "\"Keterlepasan\" menangkap sikap membiarkan dan tidak melekat, tanpa menolak teknologi. Ini usulan kamus."
yang_hilang = "Gelassenheit berakar dalam tradisi mistik Jerman, yaitu menyerahkan diri kepada Tuhan, dan Heidegger mengubahnya. Di Indonesia, kata yang paling dekat bernada religius atau pasrah, yang tidak dimaksud Heidegger."
ditolak = [
