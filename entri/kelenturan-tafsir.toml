id = "kelenturan-tafsir"
istilah = "kelenturan tafsir"
asal = { istilah = "interpretative flexibility", bahasa = "en" }
definisi = "Dalam Pinch dan Bijker, hal bahwa satu benda teknis bisa dimaknai dan dinilai berbeda oleh kelompok sosial yang berbeda, sehingga tidak ada satu \"cara terbaik\" yang ditentukan oleh benda itu sendiri."
alasan = "\"Kelenturan\" memuat gambaran sesuatu yang dapat dibengkokkan tetapi tetap berbentuk, lebih dekat daripada \"fleksibilitas\" yang bernada teknis."
yang_hilang = "\"Interpretative\" mencakup tafsir dan makna. \"Tafsir\" di Indonesia berbau teks, terutama kitab suci, sehingga \"tafsir atas sebuah sepeda\" terdengar ganjil. KBBI VI Daring (diperiksa 2026-11-11) mencatat makna kiasan \"lentur\": dapat disesuaikan dengan keadaan, yang dekat dengan maksud Pinch dan Bijker."
ditolak = [
  { padanan = "fleksibilitas interpretatif", alasan = "Serapan harfiah yang sah, tetapi kaku dan jarang dipakai." },
  { padanan = "keluwesan makna", alasan = "Terlalu longgar." },
]
terkait = ["konstruksi-sosial-teknologi", "kode-teknis"]

[[rujukan]]
sumber = "pinch-bijker-1984"
status = "belum"

