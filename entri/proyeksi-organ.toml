yang_hilang = "\"Proyeksi\" di Indonesia dikenal dari psikologi (memindahkan perasaan sendiri ke orang lain) dan statistik (perkiraan), sehingga makna Kapp yang lebih harfiah, melemparkan organ ke dalam benda, bisa tergeser."
