alasan = "\"Proyeksi\" adalah serapan yang sudah dikenal dalam psikologi dan geometri, dan maknanya \"melemparkan ke luar\" cocok."
yang_hilang = "KBBI VI Daring (diperiksa 2026-11-11) mencatat tiga makna \"proyeksi\": gambar benda yang dibuat rata; perkiraan keadaan masa depan dari data sekarang; dan mekanisme pertahanan diri dalam psikologi. Makna Kapp, melemparkan organ ke dalam benda, tidak tercatat di sana, dan makna psikologi bisa menyesatkan."
ditolak = [
