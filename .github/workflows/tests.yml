name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  deno-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        deno-version: ["v2.x", "v2.5.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ matrix.deno-version }}
      - name: Periksa format
        run: deno fmt --check
      - name: Periksa mutu
        run: deno lint
      - name: Periksa kamus (entri, sumber, rujukan silang)
        run: deno task cek
      - name: Uji
        run: deno task uji
